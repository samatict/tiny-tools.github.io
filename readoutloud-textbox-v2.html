<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="content-type" content="text/html" />
  <meta name="author" content="Sam Try" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Paste text and convert it into a clean semantic article that can be analyzed by browser Reader Mode, Immersive Reader, and Read Aloud."
  />

  <meta
    name="keywords"
    content="read aloud, reader mode, immersive reader, text to speech, Microsoft Edge, Web Speech API, GitHub Pages"
  />

  <meta
    name="theme-color"
    content="#F1E2C9"
    id="themeColorMeta"
  />

  <title>Text Read Aloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Noto+Sans"
  />

  <style>
    :root {
      --bg: #F1E2C9;
      --card: rgba(255, 255, 255, 0.72);
      --text: #222;
      --muted: #555;
      --border: #9c8f78;
      --button: #ffffff;
      --button-hover: #f4f4f4;
      --accent: #4b5563;
      --textarea-bg: #fffefb;
      --article-bg: rgba(255, 255, 255, 0.82);
      --article-border: rgba(0, 0, 0, 0.06);
      --header-border: rgba(0, 0, 0, 0.08);
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }

    body.dark-mode {
      --bg: #121212;
      --card: rgba(30, 30, 30, 0.94);
      --text: #f5f5f5;
      --muted: #c5c5c5;
      --border: #555;
      --button: #2a2a2a;
      --button-hover: #3a3a3a;
      --accent: #9ca3af;
      --textarea-bg: #1a1a1a;
      --article-bg: rgba(28, 28, 28, 0.98);
      --article-border: rgba(255, 255, 255, 0.08);
      --header-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        "Noto Sans Khmer",
        "Khmer OS System",
        "Noto Sans",
        Tahoma,
        Arial,
        "Noto Sans CJK SC",
        "Microsoft Yahei",
        serif;

      -webkit-text-size-adjust: 100%;

      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }

    body {
      min-height: 100vh;
      line-height: 1.6;
    }

    .wrapper {
      margin: 0 auto;
      padding: 8px;
      padding-bottom: 40px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin: 6px;
      font-size: 0.75rem;
    }

    .card {
      background: var(--card);

      border: 1px solid rgba(0, 0, 0, 0.08);

      border-radius: 16px;

      box-shadow: var(--shadow);

      padding: 8px;

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .title {
      margin: 0 0 6px;

      font-size: 1.5rem;

      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 14px;

      color: var(--muted);

      font-size: 0.75rem;
    }

    .instruction {
      margin: 0 0 14px;

      color: var(--muted);

      font-size: 0.75rem;
    }

    label {
      display: block;

      font-weight: 600;

      margin-bottom: 8px;
    }

    textarea {
      width: 100%;

      min-height: 280px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: var(--textarea-bg);

      padding: 7px;

      color: var(--text);

      font: inherit;

      font-size: 1rem;

      resize: vertical;

      outline: none;

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
    }

    textarea:focus {
      border-color: #6b7280;

      box-shadow:
        0 0 0 3px rgba(107, 114, 128, 0.12);
    }

    .toolbar {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;

      align-items: center;
    }

    .toolbar-group {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      align-items: center;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 1px solid #737373;

      background: var(--button);

      color: var(--text);

      cursor: pointer;

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;

      border-radius: 8px;

      padding: 5px 7px;

      min-height: 20px;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    select {
      min-height: 44px;

      border-radius: 12px;

      border: 1px solid #737373;

      padding: 0 12px;

      background: var(--button);

      color: var(--text);

      max-width: 100%;

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
    }

    .status {
      margin-top: 12px;

      color: var(--muted);

      font-size: 0.75rem;

      min-height: 1.5em;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       ARTICLE / READER VIEW

       IMPORTANT:
       Keep the article itself clean and semantic.

       Browser Reader Mode / Edge Immersive Reader should see:

       article
         header
           h1
         section
           p
           p
           p

       Custom controls are OUTSIDE the article.
       ========================================================= */

    main {
      margin-top: 18px;
    }

    article {
      background: var(--article-bg);

      border: 1px solid var(--article-border);

      border-radius: 18px;

      padding: 10px 9px;

      box-shadow: var(--shadow);

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }

    article > header {
      margin-bottom: 14px;

      border-bottom:
        1px solid var(--header-border);

      padding-bottom: 5px;
    }

    article h1 {
      margin: 0;

      font-size: 1.1rem;

      line-height: 1.25;
    }

    article p {
      margin: 0 0 1em 0;

      font-size: 1rem;

      line-height: 1.85;

      word-break: break-word;

      overflow-wrap: anywhere;
    }

    /*
     * The article body itself intentionally has no
     * display tricks, aria-live, generated content,
     * or speech-specific markup.
     */
    #articleBody {
      display: block;
    }

    #articleBody p:last-child {
      margin-bottom: 0;
    }

    /*
     * Metadata is outside the semantic article content.
     *
     * This prevents "3 paragraphs / 500 words" from being
     * interpreted as part of the article.
     */
    .article-meta {
      margin-top: 12px;

      color: var(--muted);

      font-size: 0.75rem;
    }

    /*
     * Custom Web Speech controls are explicitly separate
     * from the semantic article.
     */
    #speechControls {
      margin-top: 12px;
    }

    .footer-note {
      margin-top: 14px;

      color: var(--muted);

      font-size: 0.75rem;

      justify-content: stretch;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 560px) {

      .wrapper {
        padding: 6px;
      }

      .title {
        font-size: 1.1rem;
      }

      article h1 {
        font-size: 1.1rem;
      }

      article p {
        font-size: 1rem;
      }

      textarea {
        min-height: 240px;
      }

      .top-actions {
        justify-content: stretch;
      }

      .top-actions button {
        width: 100%;
      }
    }


    /* =========================================================
       COMPACT BUTTONS
       ========================================================= */

    #btnDarkMode,
    #btnConvert,
    #btnClear,
    #btnRead,
    #btnPause,
    #btnResume,
    #btnStop,
    #btnEdit {
      padding: 3px !important;
    }
  </style>
</head>


<body>

  <div class="wrapper">

    <!-- =======================================================
         DARK MODE
         ======================================================= -->

    <div class="top-actions">

      <button
        type="button"
        id="btnDarkMode"
        aria-pressed="false"
      >
        🌙 Dark Mode
      </button>

    </div>


    <!-- =======================================================
         EDITOR VIEW
         ======================================================= -->

    <section
      id="editorView"
      class="card"
      aria-labelledby="pageTitle"
    >

      <h1
        id="pageTitle"
        class="title"
      >
        Read Text Aloud
      </h1>

      <textarea
        id="textbox1"
        name="textbox1"
        spellcheck="true"
        placeholder="Paste or type your text here...

Then tap:
1) Convert to Article
2) Use Read Aloud
or
3) Use your browser's Reader Mode / Immersive Reader if available"
      ></textarea>


      <div class="toolbar">

        <div class="toolbar-group">

          <button
            type="button"
            id="btnConvert"
          >
            Convert to Article
          </button>

          <button
            type="button"
            id="btnClear"
          >
            Clear
          </button>

        </div>

      </div>


      <p class="footer-note">
        Maintained by: AKindBit
      </p>

    </section>


    <!-- =======================================================
         READER VIEW

         NO aria-live on this container.

         The article is allowed to remain a normal document.
         ======================================================= -->

    <main
      id="readerView"
      class="hidden"
    >


      <!-- =====================================================
           SEMANTIC ARTICLE

           Keep this area as ordinary HTML.

           Edge can analyze this article independently of the
           custom Web Speech controls below it.
           ===================================================== -->

      <article
        id="readerArticle"
      >

        <header>

          <h1 id="articleTitle">
            Read Text Aloud
          </h1>

        </header>


        <section
          id="articleBody"
          aria-label="Article content"
        >
          <!-- Paragraphs are inserted here by JavaScript. -->
        </section>

      </article>


      <!-- =====================================================
           ARTICLE INFORMATION

           Outside <article>, so it is not treated as article
           content by Reader Mode.
           ===================================================== -->

      <div
        class="article-meta"
        id="articleMeta"
      >
        Clean article view for better readability.
      </div>


      <!-- =====================================================
           CUSTOM WEB SPEECH CONTROLS

           These are deliberately OUTSIDE <article>.
           ===================================================== -->

      <div
        id="speechControls"
        class="toolbar"
        aria-label="Text to speech controls"
      >

        <div class="toolbar-group">

          <button
            type="button"
            id="btnRead"
          >
            Read Aloud
          </button>

          <button
            type="button"
            id="btnPause"
          >
            Pause
          </button>

          <button
            type="button"
            id="btnResume"
          >
            Resume
          </button>

          <button
            type="button"
            id="btnStop"
          >
            Stop
          </button>

          <button
            type="button"
            id="btnEdit"
          >
            Edit Text
          </button>

        </div>


        <div class="toolbar-group">

          <label
            for="voiceSelect"
            class="hidden"
          >
            Voice
          </label>

          <select
            id="voiceSelect"
            aria-label="Choose voice"
          >

            <option value="">
              Default voice
            </option>

          </select>

        </div>

      </div>


      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>

    </main>

  </div>


  <script>
    (function () {

      "use strict";


      /* =========================================================
         DOM ELEMENTS
         ========================================================= */

      const editorView =
        document.getElementById("editorView");

      const readerView =
        document.getElementById("readerView");

      const textbox =
        document.getElementById("textbox1");

      const articleTitle =
        document.getElementById("articleTitle");

      const articleBody =
        document.getElementById("articleBody");

      const articleMeta =
        document.getElementById("articleMeta");

      const statusEl =
        document.getElementById("status");

      const themeColorMeta =
        document.getElementById("themeColorMeta");

      const btnConvert =
        document.getElementById("btnConvert");

      const btnClear =
        document.getElementById("btnClear");

      const btnRead =
        document.getElementById("btnRead");

      const btnPause =
        document.getElementById("btnPause");

      const btnResume =
        document.getElementById("btnResume");

      const btnStop =
        document.getElementById("btnStop");

      const btnEdit =
        document.getElementById("btnEdit");

      const btnDarkMode =
        document.getElementById("btnDarkMode");

      const voiceSelect =
        document.getElementById("voiceSelect");


      /* =========================================================
         SPEECH SYNTHESIS
         ========================================================= */

      const synth =
        "speechSynthesis" in window
          ? window.speechSynthesis
          : null;

      let voices = [];

      let currentUtterance = null;

      let speechPaused = false;

      let speechStopped = false;


      /* =========================================================
         GENERAL
         ========================================================= */

      function setStatus(message) {

        statusEl.textContent =
          message || "";

      }


      function supportsSpeech() {

        return (
          "speechSynthesis" in window &&
          "SpeechSynthesisUtterance" in window
        );

      }


      function countWords(text) {

        return (
          text
            .trim()
            .match(/\S+/g) || []
        ).length;

      }


      /* =========================================================
         DARK MODE
         ========================================================= */

      function updateThemeButton() {

        const isDark =
          document.body.classList.contains(
            "dark-mode"
          );

        btnDarkMode.textContent =
          isDark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        btnDarkMode.setAttribute(
          "aria-pressed",
          isDark
            ? "true"
            : "false"
        );

        themeColorMeta.setAttribute(
          "content",
          isDark
            ? "#121212"
            : "#F1E2C9"
        );
      }


      function applyTheme(theme) {

        if (theme === "dark") {

          document.body.classList.add(
            "dark-mode"
          );

        } else {

          document.body.classList.remove(
            "dark-mode"
          );

        }

        updateThemeButton();
      }


      function toggleDarkMode() {

        const isDark =
          document.body.classList.contains(
            "dark-mode"
          );

        const nextTheme =
          isDark
            ? "light"
            : "dark";

        applyTheme(nextTheme);

        try {

          localStorage.setItem(
            "textReaderTheme",
            nextTheme
          );

        } catch (e) {}

      }


      function loadSavedTheme() {

        let savedTheme = null;

        try {

          savedTheme =
            localStorage.getItem(
              "textReaderTheme"
            );

        } catch (e) {}

        if (
          savedTheme === "dark" ||
          savedTheme === "light"
        ) {

          applyTheme(savedTheme);

        } else {

          applyTheme("light");

        }
      }


      /* =========================================================
         VOICE MANAGEMENT
         ========================================================= */

      function populateVoices() {

        if (!supportsSpeech()) {
          return;
        }

        const freshVoices =
          synth.getVoices() || [];

        voices =
          freshVoices;

        const previousValue =
          voiceSelect.value;

        voiceSelect.innerHTML =
          "";

        const defaultOption =
          document.createElement(
            "option"
          );

        defaultOption.value = "";

        defaultOption.textContent =
          "Default voice";

        voiceSelect.appendChild(
          defaultOption
        );

        const seen =
          new Set();

        freshVoices.forEach(
          function (voice, index) {

            const key =
              voice.name +
              "|" +
              voice.lang;

            if (seen.has(key)) {
              return;
            }

            seen.add(key);

            const option =
              document.createElement(
                "option"
              );

            option.value =
              String(index);

            option.textContent =
              voice.name +
              " (" +
              voice.lang +
              ")" +
              (
                voice.default
                  ? " — default"
                  : ""
              );

            voiceSelect.appendChild(
              option
            );

          }
        );


        /*
         * Restore the user's previous selection
         * if that voice still exists.
         */

        if (
          previousValue &&
          voiceSelect.querySelector(
            'option[value="' +
            CSS.escape(previousValue) +
            '"]'
          )
        ) {

          voiceSelect.value =
            previousValue;

        }

      }


      function getSelectedVoice() {

        const value =
          voiceSelect.value;

        if (value === "") {
          return null;
        }

        const index =
          Number(value);

        if (
          !Number.isInteger(index) ||
          !voices[index]
        ) {
          return null;
        }

        return voices[index];
      }


      /* =========================================================
         TEXT → PARAGRAPHS
         ========================================================= */

      function textToParagraphs(rawText) {

        /*
         * Normalize line endings.
         */

        const normalized =
          rawText
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");


        /*
         * A blank line separates paragraphs.
         */

        return normalized
          .split(/\n\s*\n/)
          .map(
            function (part) {
              return part.trim();
            }
          )
          .filter(
            function (part) {
              return part.length > 0;
            }
          );

      }


      /* =========================================================
         BUILD SEMANTIC ARTICLE
         ========================================================= */

      function buildArticleFromText(rawText) {

        const paragraphs =
          textToParagraphs(rawText);


        /*
         * Remove only the dynamically generated paragraph
         * elements from the article body.
         *
         * Do NOT remove article/header structure.
         */

        while (
          articleBody.firstChild
        ) {

          articleBody.removeChild(
            articleBody.firstChild
          );

        }


        /*
         * No paragraphs.
         */

        if (!paragraphs.length) {

          articleMeta.textContent =
            "Clean article view for better readability.";

          return 0;
        }


        /*
         * IMPORTANT:
         *
         * Every paragraph is inserted.
         *
         * There is deliberately NO:
         *
         *   if (index === 0) return;
         *
         * The first paragraph is therefore preserved.
         */

        paragraphs.forEach(
          function (paragraphText) {

            const p =
              document.createElement(
                "p"
              );

            p.textContent =
              paragraphText;

            articleBody.appendChild(
              p
            );

          }
        );


        const paragraphCount =
          paragraphs.length;

        const wordCount =
          countWords(rawText);


        articleMeta.textContent =
          paragraphCount +
          " paragraph" +
          (
            paragraphCount === 1
              ? ""
              : "s"
          ) +
          " • " +
          wordCount +
          " words";


        return paragraphCount;
      }


      /* =========================================================
         CONVERT TO ARTICLE
         ========================================================= */

      function convertToArticle() {

        const rawText =
          textbox.value;


        /*
         * Do not alter the actual text before parsing.
         *
         * Only use trim() to determine whether the editor
         * is empty.
         */

        if (!rawText.trim()) {

          alert(
            "Please enter or paste some text first."
          );

          textbox.focus();

          return;
        }


        const paragraphCount =
          buildArticleFromText(
            rawText
          );


        /*
         * Give the article a meaningful heading.
         *
         * This is important for semantic document structure.
         */

        articleTitle.textContent =
          "Read Text Aloud";


        /*
         * Show article.
         */

        editorView.classList.add(
          "hidden"
        );

        readerView.classList.remove(
          "hidden"
        );


        setStatus(
          "Article ready. You can use Edge Reader Mode / Read Aloud or the custom Read Aloud button."
        );


        /*
         * Scroll to the beginning of the document.
         *
         * The article remains ordinary DOM content.
         */

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }


      /* =========================================================
         STOP SPEECH
         ========================================================= */

      function stopSpeech() {

        if (!supportsSpeech()) {
          return;
        }


        /*
         * Set this BEFORE cancel().
         *
         * Browser speech events can arrive after cancel().
         */

        speechStopped =
          true;

        speechPaused =
          false;


        synth.cancel();


        currentUtterance =
          null;

      }


      /* =========================================================
         PAUSE
         ========================================================= */

      function pauseSpeech() {

        if (!supportsSpeech()) {

          setStatus(
            "Speech synthesis is not available in this browser."
          );

          return;
        }


        if (!currentUtterance) {

          setStatus(
            "Nothing is currently being read."
          );

          return;
        }


        if (speechPaused) {

          setStatus(
            "Already paused."
          );

          return;
        }


        /*
         * Pause the browser speech engine.
         */

        synth.pause();


        speechPaused =
          true;


        setStatus(
          "Paused."
        );

      }


      /* =========================================================
         RESUME
         ========================================================= */

      function resumeSpeech() {

        if (!supportsSpeech()) {
          return;
        }


        if (!currentUtterance) {

          setStatus(
            "Nothing is paused."
          );

          return;
        }


        if (
          speechPaused ||
          synth.paused
        ) {

          speechStopped =
            false;

          synth.resume();

          speechPaused =
            false;

          setStatus(
            "Resumed."
          );

          return;
        }


        setStatus(
          "Speech is not currently paused."
        );

      }


      /* =========================================================
         CUSTOM WEB SPEECH — READ
         ========================================================= */

      function speakTextFromArticle() {

        if (!supportsSpeech()) {

          setStatus(
            "This browser does not support built-in speech synthesis."
          );

          return;
        }


        /*
         * IMPORTANT:
         *
         * Read from the SEMANTIC ARTICLE, not from the
         * textarea.
         *
         * This means the custom reader follows exactly
         * what the user sees in the article.
         */

        const text =
          articleBody.innerText.trim();


        if (!text) {

          setStatus(
            "No article text is available to read."
          );

          return;
        }


        /*
         * Stop any previous speech.
         */

        speechStopped =
          true;

        speechPaused =
          false;

        synth.cancel();


        /*
         * Reset stop state for this new utterance.
         */

        speechStopped =
          false;


        /*
         * Refresh voices.
         */

        populateVoices();


        /*
         * Create ONE utterance.
         */

        const utterance =
          new SpeechSynthesisUtterance(
            text
          );


        const selectedVoice =
          getSelectedVoice();


        if (selectedVoice) {

          utterance.voice =
            selectedVoice;

          utterance.lang =
            selectedVoice.lang ||
            "en-US";

        } else {

          /*
           * Do not force English if the user has not
           * selected a voice.
           *
           * Let the browser choose its default.
           */

          utterance.lang =
            document.documentElement.lang ||
            "en";

        }


        utterance.rate =
          1;

        utterance.pitch =
          1;

        utterance.volume =
          1;


        /*
         * Store the SAME utterance before speak().
         */

        currentUtterance =
          utterance;


        /* =====================================================
           SPEECH EVENTS
           ===================================================== */

        utterance.onstart =
          function () {

            if (
              currentUtterance !==
              utterance
            ) {
              return;
            }

            if (speechStopped) {
              return;
            }

            speechPaused =
              false;

            setStatus(
              "Reading aloud..."
            );

          };


        utterance.onpause =
          function () {

            if (
              currentUtterance !==
              utterance
            ) {
              return;
            }

            speechPaused =
              true;

            if (!speechStopped) {

              setStatus(
                "Paused."
              );

            }

          };


        utterance.onresume =
          function () {

            if (
              currentUtterance !==
              utterance
            ) {
              return;
            }

            speechPaused =
              false;

            if (!speechStopped) {

              setStatus(
                "Reading aloud..."
              );

            }

          };


        utterance.onend =
          function () {

            if (
              currentUtterance !==
              utterance
            ) {
              return;
            }

            speechPaused =
              false;

            if (!speechStopped) {

              setStatus(
                "Finished reading."
              );

            }

            currentUtterance =
              null;

          };


        utterance.onerror =
          function (event) {

            if (
              currentUtterance !==
              utterance
            ) {
              return;
            }

            speechPaused =
              false;


            if (!speechStopped) {

              const error =
                event &&
                event.error
                  ? event.error
                  : "unknown error";

              setStatus(
                "Speech error: " +
                error
              );

            }


            currentUtterance =
              null;

          };


        /* =====================================================
           IMPORTANT:

           NO setTimeout().
           NO delayed speak().

           Call speak() directly.
           ===================================================== */

        synth.speak(
          utterance
        );

      }


      /* =========================================================
         RETURN TO EDITOR
         ========================================================= */

      function goBackToEdit() {

        stopSpeech();


        readerView.classList.add(
          "hidden"
        );

        editorView.classList.remove(
          "hidden"
        );


        setStatus("");


        textbox.focus();

      }


      /* =========================================================
         CLEAR
         ========================================================= */

      function clearAll() {

        stopSpeech();


        textbox.value =
          "";


        while (
          articleBody.firstChild
        ) {

          articleBody.removeChild(
            articleBody.firstChild
          );

        }


        articleTitle.textContent =
          "Read Text Aloud";


        articleMeta.textContent =
          "Clean article view for better readability.";


        setStatus("");


        readerView.classList.add(
          "hidden"
        );

        editorView.classList.remove(
          "hidden"
        );


        textbox.focus();

      }


      /* =========================================================
         BUTTON EVENTS
         ========================================================= */

      btnConvert.addEventListener(
        "click",
        convertToArticle
      );


      btnClear.addEventListener(
        "click",
        clearAll
      );


      btnRead.addEventListener(
        "click",
        speakTextFromArticle
      );


      btnPause.addEventListener(
        "click",
        pauseSpeech
      );


      btnResume.addEventListener(
        "click",
        resumeSpeech
      );


      btnStop.addEventListener(
        "click",
        function () {

          stopSpeech();

          setStatus(
            "Stopped."
          );

        }
      );


      btnEdit.addEventListener(
        "click",
        goBackToEdit
      );


      btnDarkMode.addEventListener(
        "click",
        toggleDarkMode
      );


      /* =========================================================
         VOICE INITIALIZATION
         ========================================================= */

      if (supportsSpeech()) {

        populateVoices();


        /*
         * Voices can become available after page load.
         */

        if (
          "onvoiceschanged" in synth
        ) {

          synth.onvoiceschanged =
            populateVoices;

        }

      }


      /* =========================================================
         CTRL / CMD + ENTER
         ========================================================= */

      textbox.addEventListener(
        "keydown",
        function (event) {

          const platform =
            navigator.platform
              .toUpperCase();


          const isMac =
            platform.indexOf(
              "MAC"
            ) >= 0;


          const modifier =
            isMac
              ? event.metaKey
              : event.ctrlKey;


          if (
            modifier &&
            event.key === "Enter"
          ) {

            event.preventDefault();

            convertToArticle();

          }

        }
      );


      /* =========================================================
         LOAD THEME
         ========================================================= */

      loadSavedTheme();

    })();
  </script>

</body>
